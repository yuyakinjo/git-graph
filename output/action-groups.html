<div id="squid-actions" aria-label="操作ツールバーの提案">
  <div class="sq-context">
    git-squid <span>⌁ feature/action-menu</span><span class="sq-note">UI プレビュー</span>
  </div>
  <div class="sq-toolbar" aria-label="操作の分類">
    <button data-group="Git" aria-expanded="false">Git ▾</button>
    <button data-group="GitHub" aria-expanded="false">GitHub ▾</button>
    <button data-group="カスタム" aria-expanded="true">カスタム ▾</button>
  </div>
  <div class="sq-recent" aria-label="最近使った機能">
    <span>最近</span
    ><button data-action="プッシュ" data-kind="Git">プッシュ <small>Git</small></button
    ><button data-action="PR 作成" data-kind="GitHub">PR 作成 <small>GitHub</small></button
    ><button data-action="マージ済みを整理 (tidy)…" data-kind="カスタム">
      tidy… <small>カスタム</small>
    </button>
  </div>
  <section class="sq-menu" aria-label="操作一覧">
    <div class="sq-heading">カスタム</div>
    <div class="sq-items"></div>
  </section>
  <div class="sq-feedback" aria-live="polite">対象: git-squid / feature/action-menu</div>
</div>
<style>
  #squid-actions {
    --sq-bg: light-dark(#fafbfc, #171a20);
    --sq-fg: light-dark(#202735, #e4e8ef);
    --sq-line: light-dark(#dce0e6, #363c46);
    --sq-muted: light-dark(#596475, #a1abba);
    --sq-hover: light-dark(#e8edf4, #2c3441);
    --sq-blue: light-dark(#2159a4, #99c5ff);
    color: var(--sq-fg);
    background: var(--sq-bg);
    font:
      13px/1.5 system-ui,
      sans-serif;
    border: 1px solid var(--sq-line);
    border-radius: 9px;
    overflow: hidden;
  }
  #squid-actions * {
    box-sizing: border-box;
  }
  #squid-actions .sq-context {
    display: flex;
    flex-wrap: wrap;
    gap: 8px 20px;
    padding: 12px 16px;
    border-bottom: 1px solid var(--sq-line);
    font-weight: 600;
  }
  #squid-actions .sq-context span {
    font-weight: 400;
    color: var(--sq-muted);
  }
  #squid-actions .sq-note {
    margin-left: auto;
  }
  #squid-actions .sq-toolbar,
  #squid-actions .sq-recent {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    align-items: center;
    padding: 8px 12px;
    border-bottom: 1px solid var(--sq-line);
  }
  #squid-actions button {
    font: inherit;
    color: inherit;
    background: transparent;
    border: 0;
    border-radius: 5px;
    padding: 7px 11px;
    cursor: pointer;
    text-align: left;
    white-space: normal;
  }
  #squid-actions button:hover,
  #squid-actions button[aria-expanded="true"] {
    background: var(--sq-hover);
  }
  #squid-actions small,
  #squid-actions .sq-recent > span {
    color: var(--sq-muted);
    font-size: 11px;
  }
  #squid-actions small {
    margin-left: 6px;
  }
  #squid-actions .sq-menu {
    margin: 12px;
    max-width: 360px;
    padding: 6px;
    border: 1px solid var(--sq-line);
    border-radius: 7px;
    background: var(--sq-bg);
  }
  #squid-actions .sq-heading {
    padding: 5px 10px;
    color: var(--sq-muted);
    font-size: 12px;
  }
  #squid-actions .sq-items button {
    display: block;
    width: 100%;
    padding: 9px 10px;
  }
  #squid-actions .sq-items span {
    display: block;
    color: var(--sq-muted);
    font-size: 12px;
    margin-top: 2px;
  }
  #squid-actions .sq-feedback {
    border-top: 1px solid var(--sq-line);
    padding: 12px 16px;
    color: var(--sq-blue);
  }
  @media (pointer: coarse) {
    #squid-actions button {
      min-height: 44px;
    }
  }
</style>
<script>
  (() => {
    const root = document.getElementById("squid-actions");
    const groups = {
      Git: [
        ["フェッチ", "リモートの状態を取得"],
        ["プル…", "merge / rebase を選択"],
        ["プッシュ", "現在のブランチを送信"],
        ["ブランチを作成…", "現在の位置から作成"],
        ["スタッシュ…", "変更の退避・復元"],
        ["worktree を追加…", "別の作業ディレクトリを作成"],
      ],
      GitHub: [
        ["PR 作成", "現在のブランチから作成"],
        ["GitHub で開く", "リポジトリをブラウザで表示"],
      ],
      カスタム: [["マージ済みを整理 (tidy)…", "マージ済みのブランチ・worktree の整理候補を確認"]],
    };
    let active = "カスタム";
    const opts = { recent: true };
    function show(group) {
      active = group;
      root.querySelector(".sq-heading").textContent = group;
      root
        .querySelectorAll("[data-group]")
        .forEach((b) => b.setAttribute("aria-expanded", String(b.dataset.group === group)));
      const list = root.querySelector(".sq-items");
      list.replaceChildren();
      groups[group].forEach(([label, desc]) => {
        const b = document.createElement("button");
        b.type = "button";
        b.dataset.action = label;
        b.dataset.kind = group;
        b.textContent = label;
        const s = document.createElement("span");
        s.textContent = desc;
        b.append(s);
        list.append(b);
      });
    }
    root.addEventListener("click", (e) => {
      const b = e.target.closest("button");
      if (!b) return;
      if (b.dataset.group) {
        show(b.dataset.group);
        return;
      }
      if (b.dataset.action) {
        const label = b.dataset.action;
        root.querySelector(".sq-feedback").textContent = label.includes("tidy")
          ? "tidy: 整理候補を表示 → 対象を選択 → 実行（プレビュー）"
          : b.dataset.kind + " / " + label + " — 現在のリポジトリを対象に開く（プレビュー）";
      }
    });
    show(active);
    if (globalThis.Tweak) {
      const tweak = new Tweak({
        container: root,
        onChange: () => {
          root.querySelector(".sq-recent").hidden = !opts.recent;
          root.querySelector(".sq-recent").style.display = opts.recent ? "flex" : "none";
        },
      });
      tweak.addToggle(opts, "recent", { label: "最近の操作を常時表示" });
    }
  })();
</script>
