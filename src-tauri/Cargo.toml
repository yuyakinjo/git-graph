[package]
name = "git-squid"
version = "0.1.0"
description = "Simple git GUI with a beautiful commit graph"
authors = ["git-squid"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"
default-run = "git-squid"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# E2E テスト用に、Tauri を介さずコマンドを呼ぶブリッジ (e2e/ の Playwright から使う)
[[bin]]
name = "e2e-bridge"
path = "src/bin/e2e-bridge.rs"
required-features = ["e2e"]

[features]
e2e = []

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
